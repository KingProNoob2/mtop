[package]
name = "mtop"
version = "0.1.0"
edition = "2024"
description = "Apple Silicon performance monitor (CPU, GPU, ANE, power, frequency, thermals) for macOS 27+"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
libc = "0.2"
plist = "1.7"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
